# @package _global_

# DAggerBC student for HOI teacher.
# Key requirement: `teacher_obs` MUST match the teacher training `actor_obs` exactly (same fields + same order),
# otherwise the teacher actor checkpoint won't load / won't run due to input-dim mismatch.
#
# Teacher here: +obs=humanx/hoi_teacher_tracking

obs:
  obs_dict:
    # Student policy observation.
    # Note: actor_obs does NOT include AMP-related fields (student is non-AMP trained).
    # See critic_obs section below for why AMP fields are included there.
    actor_obs: [
      base_ang_vel, #3
      projected_gravity, #3
      dof_pos, #robot.dof_obs_size, 29
      dof_vel, #robot.dof_obs_size, 29
      actions, #robot.dof_obs_size, 29
      pd_error, #robot.dof_obs_size, 29
      local_curr_ball_position, #3
      history_actor,
    ]

    # Student critic observation.
    # NOTE: Even though student is trained without AMP, critic_obs includes amp_expert_dof_pos and amp_expert_dof_vel.
    # Reasons:
    # 1. Checkpoint compatibility: If load_teacher_critic=True (default), student critic must match teacher's critic_obs
    #    dimension to successfully load the teacher's critic checkpoint for warm-start.
    # 2. No inference impact: These fields are ONLY used in critic (for value estimation during training),
    #    NOT in actor_obs, so they don't affect inference/deployment at all.
    # 3. Potential benefit: In non-AMP training, amp_expert_dof_pos/vel come from reference motion (expert_dof_pos/vel),
    #    which may provide useful information for the critic to estimate value functions.
    critic_obs: [
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      actions,
      dof_pos,
      local_keybodies_pos,
      local_keybodies_vel,
      dif_local_rigid_body_pos,
      local_ref_rigid_body_pos,
      local_curr_ball_position_wo_packet_loss, # local_curr_ball_position,
      local_ref_ball_position,
      reference_command,
      diff_ig,
      curr_interaction_graph,
      bodies_contact_force,
      history_critic,
      amp_expert_dof_pos,
      amp_expert_dof_vel,
    ]

    # Teacher policy observation used inside DAggerBC for BC loss.
    # MUST match humanx/hoi_teacher_tracking's actor_obs.
    teacher_obs: [
      base_ang_vel, #3
      projected_gravity, #3
      dof_pos, #robot.dof_obs_size, 29
      dof_vel, #robot.dof_obs_size, 29
      actions, #robot.dof_obs_size, 29
      pd_error, #robot.dof_obs_size, 29 #wyh
      local_curr_ball_position, #3
      reference_command,
      history_teacher,
    ]

  # This must match the teacher checkpoint's reference-command definition.
  reference_command:
    body_names: [
      "left_hand_link",
      "right_hand_link",
    ]
    future_steps: [0, 1, 3, 6, 10, 15, 20, 25, 30]
    include_ball_contact: true

  obs_auxiliary:
    # Student actor history.
    history_actor: {
      base_ang_vel: 4,
      projected_gravity: 4,
      actions: 4,
      dof_pos: 4,
      dof_vel: 4,
      local_curr_ball_position: 4,
    }

    # Student critic history.
    # NOTE: Includes amp_expert_dof_pos/vel history for the same reasons as critic_obs above:
    # checkpoint compatibility and potential value estimation benefit from reference motion information.
    history_critic: {
      base_lin_vel: 4,
      base_ang_vel: 4,
      projected_gravity: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      local_keybodies_pos: 4,
      local_curr_ball_position_wo_packet_loss: 4,
      amp_expert_dof_pos: 4,
      amp_expert_dof_vel: 4,
    }

    # Teacher history (DO NOT change unless you retrain the teacher with a new obs).
    history_teacher: {
      base_ang_vel: 4,
      projected_gravity: 4,
      actions: 4,
      dof_pos: 4,
      dof_vel: 4,
      local_curr_ball_position: 4,
    }

  # Keep the same scaling/noise/dims block as humanx/hoi_teacher_tracking for compatibility.
  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    dif_local_rigid_body_pos: 1.0,
    local_ref_rigid_body_pos: 1.0,
    history_actor: 1.0,
    history_critic: 1.0,
    history_teacher: 1.0,
    local_curr_ball_position: 1.0,
    local_ref_ball_position: 1.0,
    reference_command: 1.0,
    curr_interaction_graph: 1.0,
    diff_ig: 1.0,
    local_keybodies_pos: 1.0,
    local_keybodies_vel: 1.0,
    bodies_contact_force: 1.0,
    pd_error: 1.0,
    amp_expert_dof_pos: 1.0,
    amp_expert_dof_vel: 1.0,
    local_curr_ball_position_wo_packet_loss: 1.0,
  }

  noise_scales: {
    base_lin_vel: 0.0,
    base_ang_vel: 0.3,
    projected_gravity: 0.2,
    dof_pos: 0.01,
    dof_vel: 1.0,
    actions: 0.0,
    dif_local_rigid_body_pos: 0.0,
    local_ref_rigid_body_pos: 0.0,
    history_actor: 0.0,
    history_critic: 0.0,
    history_teacher: 0.0,
    local_curr_ball_position: 0.01,
    local_ref_ball_position: 0.0,
    reference_command: 0.0,
    curr_interaction_graph: 0.01,
    diff_ig: 0.0,
    local_keybodies_pos: 0.01,
    local_keybodies_vel: 0.01,
    bodies_contact_force: 0.0,
    pd_error: 0.01,
    amp_expert_dof_pos: 0.0,
    amp_expert_dof_vel: 0.0,
    local_curr_ball_position_wo_packet_loss: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001

  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - dif_local_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 21'}
    - local_ref_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 21'}
    - local_curr_ball_position: 3
    - local_ref_ball_position: 3
    - reference_command: ${if:${obs.reference_command.include_ball_contact},${eval:'3 * len(${obs.reference_command.body_names}) * len(${obs.reference_command.future_steps}) + len(${obs.reference_command.future_steps})'},${eval:'3 * len(${obs.reference_command.body_names}) * len(${obs.reference_command.future_steps})'}}
    - bodies_contact_force: ${eval:'3 * len(${robot.hoi_no_contact_bodies}) + 3 * 1'}
    - curr_interaction_graph: ${eval:'3 * len(${robot.hoi_interaction_bodies})'}
    - diff_ig: ${eval:'3 * len(${robot.hoi_interaction_bodies})'}
    - local_keybodies_pos: ${eval:'3 * len(${robot.key_body_names})'}
    - local_keybodies_vel: ${eval:'3 * len(${robot.key_body_names})'}
    - pd_error: ${robot.dof_obs_size}
    - amp_expert_dof_pos: ${eval:'len(${robot.amp_dof_selected})'}
    - amp_expert_dof_vel: ${eval:'len(${robot.amp_dof_selected})'}
    - local_curr_ball_position_wo_packet_loss: 3
  post_compute_config: {} # Will store values after preprocessing, don't put anything here
  
  use_projectile_as_obj_obs: false # Temporary switch: use projectile as obj/ball related observations for policy/critic (default off, backward compatible)
