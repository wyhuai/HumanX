# @package _global_

algo:
  _target_: humanoidverse.agents.AMP.amp_ppo.AMP_PPO
  _recursive_: False
  config:
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    actor_learning_rate: 1.e-3 # 5e-4 # 1.e-3
    critic_learning_rate: 1.e-3 # 5e-4 # 1.e-3
    disc_learning_rate: 1e-3
    max_grad_norm: 1.0
    use_clipped_value_loss: True
    schedule: "adaptive"
    desired_kl: 0.01

    num_steps_per_env: 24
    save_interval: 1000

    load_optimizer: True

    init_noise_std: 0.8

    amploss_coef: 1.0
    
    disc_grad_penalty_lambda: 10 # Discriminator gradient penalty (compute_grad_pen). Set 0 to disable for speed.

    resume: False
    resume_path: null

    num_learning_iterations: 1000000
    init_at_random_ep_len: True
    eval_callbacks: null

    module_dict:
      actor: 
        input_dim: [actor_obs]
        output_dim: [robot_action_dim]
        layer_config:
          type: MLP
          hidden_dims: [512, 256, 128]
          activation: ELU
      critic: 
        type: MLP
        input_dim: [critic_obs]
        output_dim: [1]
        layer_config:
          type: MLP
          hidden_dims: [1024, 512, 256]
          activation: ELU
      Discriminator: 
        input_dim: [amp_obs]
        amp_reward_coef: 0.3
        hidden_dims: [1024, 512, 256]
        task_reward_lerp: 0.7
      amp_normalizer: 
        input_dim: [amp_obs]
